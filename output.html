<p>Move your mouse to see its position: </p>
    <p id="coordinates"></p>

    <script>
        const coordinatesDisplay = document.getElementById('coordinates'); //this just displays coords of the mouse (I used this for early testing)

        document.addEventListener('mousemove', function(event) {
            const clientX = event.clientX;
            const clientY = event.clientY;
            coordinatesDisplay.textContent = `X: ${clientX}, Y: ${clientY}`;

        });
    </script>
